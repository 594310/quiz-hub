  <h1>🌌 紫微斗數命盤・精準版</h1>
  <p class="lead">十二宮、十四主星、六吉六煞、雜曜、星曜廟旺利陷、生年四化、大限小限流年<br>每個名詞都附白話解釋，點命盤中任一宮可看詳細說明</p>

  <section class="card" id="formcard">
    <div class="tabs">
      <button class="tab on" id="tabS" onclick="setMode('solar')">國曆（陽曆）生日</button>
      <button class="tab" id="tabL" onclick="setMode('lunar')">農曆生日</button>
    </div>
    <div id="solarBox" class="row">
      <div><label>出生日期</label><input type="date" id="sdate" value="1995-06-15" min="1900-02-01" max="2099-12-31"></div>
    </div>
    <div id="lunarBox" class="row hidden">
      <div><label>農曆年（西元）</label><input type="number" id="lyear" value="1995" min="1900" max="2099"></div>
      <div><label>農曆月</label><select id="lmonth"></select></div>
      <div><label>農曆日</label><select id="lday"></select></div>
      <div><label>是否閏月</label><select id="lleap"><option value="0">否</option><option value="1">是（閏月）</option></select></div>
    </div>
    <div class="row">
      <div><label>出生時辰</label><select id="shichen"></select></div>
      <div><label>性別</label><select id="gender"><option value="M">男</option><option value="F">女</option></select></div>
      <div><label>稱呼（可不填）</label><input type="text" id="nm" maxlength="12" placeholder="例如：小明"></div>
    </div>
    <div class="center-btns"><button class="btn" onclick="run()">排出命盤</button></div>
    <div class="info">所有計算都在你的瀏覽器中完成，資料不會傳到任何地方。<br>
    晚子時（23:00–23:59）依多數排盤軟體的做法，日柱算隔天；本版以出生地的標準時間計算，不做真太陽時校正。</div>
  </section>

  <section class="card hidden" id="savedcard"><h2>💾 已儲存的命盤（僅存在這台裝置）</h2><div id="saved"></div></section>
  <div id="out"></div>

 ['雜曜（輔助小星）','紅鸞、天喜、咸池、華蓋、天刑…等較小的星，補充細節（桃花、孤獨、口舌…），影響比主星細微。命盤上預設以灰色小字顯示，可用上方開關關閉。'],
 ['四化：祿、權、科、忌','依「出生年天干」把四顆星各貼上一個標籤：<b style="color:#16a34a">祿</b>（機緣財運）、<b style="color:#2563eb">權</b>（掌控成就）、<b style="color:#d97706">科</b>（名聲貴人）、<b style="color:#dc2626">忌</b>（執著課題）。看這四顆星落在哪一宮，就知道人生的哪個領域特別有這種色彩。'],
 ['三方四正','看一個宮位時，不只看它本身，還要看它的對宮（對面）以及三合的兩個宮位（例如命宮對應財帛宮、官祿宮、遷移宮）。這四個宮位的星合起來才是完整的判斷。'],
 ['大限、小限、流年','<b>大限</b>：每十年一個階段，走到哪一宮，那十年的重心就偏向該宮。<b>小限</b>：一年一宮的虛歲小運。<b>流年</b>：以該年天干重新排的四化與流星，看那一年哪個領域有機會或壓力。'],
 ['長生十二神與博士十二神','長生十二神（長生、沐浴、冠帶…）描述宮位的能量階段；博士十二神是另一組輔助的星。屬於進階內容，一般解讀可先略過，可用上方開關顯示。'],
 ['來因宮','命盤中標示「來因」的宮位，是依出生年天干推出的特殊宮位，用於進階推論，一般可先略過。']
];

/* ========== 共用小工具 ========== */
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const $=id=>document.getElementById(id);
const fx=s=>String(s).replace(/闰/g,'閏').replace(/腊/g,'臘');
const pname=n=>n.endsWith('宮')?n:n+'宮';
const pkey=n=>n.replace('宮','');
let A=null, MODE='solar', SEL='命宮', SHOW_ADJ=true, SHOW_12=false, INFO=null;

/* ========== 排盤 ========== */
function compute(){
  const gender=$('gender').value==='M'?'男':'女', ti=+$('shichen').value;
  if(MODE==='solar'){
    const v=$('sdate').value; if(!v) throw new Error('請輸入出生日期');
    const [y,m,d]=v.split('-').map(Number);
    INFO={ds:`${y}/${m}/${d}`}; return iztro.astro.bySolar(`${y}-${m}-${d}`,ti,gender,true,'zh-TW');
  }
  const y=+$('lyear').value,m=+$('lmonth').value,d=+$('lday').value,leap=$('lleap').value==='1';
  INFO={ds:'（以農曆輸入）'}; return iztro.astro.byLunar(`${y}-${m}-${d}`,ti,gender,leap,true,'zh-TW');
}
function run(){
  try{A=compute()}catch(e){alert(e.message||'排盤失敗，請檢查輸入');return}
  SEL='命宮'; INFO.name=$('nm').value.trim(); sv('hub.ziwei.last',getInp());
  render(); $('out').scrollIntoView({behavior:'smooth'});
}
const palOf=n=>A.palaces.find(p=>pkey(p.name)===pkey(n));
function starPalace(name){return A.palaces.find(p=>[...p.majorStars,...p.minorStars].some(s=>s.name===name))}
function majors(p){return p.majorStars.map(s=>s.name)}

/* ========== 渲染 ========== */
function huaTag(m){return m?`<span class="hua ${m}">${m}</span>`:''}
function brTag(b){return b?`<sup class="br br-${b}">${b}</sup>`:''}
function minorCls(s){return s.type==='soft'?'g':s.type==='tough'?'b':s.type==='lucun'?'g':s.type==='tianma'?'k':'x'}
function cellHTML(p){
  const [r,c]=AREA[ZHI.indexOf(p.earthlyBranch)];
  const badges=(p.name==='命宮'?'<span class="badge">命</span>':'')+(p.isBodyPalace?'<span class="badge sh">身</span>':'')+(p.isOriginalPalace?'<span class="badge ly">來因</span>':'');
  const mj=p.majorStars.map(s=>`<span class="st m">${s.name}${brTag(s.brightness)}${huaTag(s.mutagen)}</span>`).join('')||'<span class="st b" style="font-size:12px">（無主星）</span>';
  const mn=p.minorStars.map(s=>`<span class="st ${minorCls(s)}">${s.name}${brTag(s.brightness)}${huaTag(s.mutagen)}</span>`).join('');
  const adj=SHOW_ADJ&&p.adjectiveStars.length?`<div class="adj">${p.adjectiveStars.map(s=>`<span>${s.name}</span>`).join('')}</div>`:'';
  const tw=SHOW_12?`<div class="twelve">${p.changsheng12}・${p.boshi12}・${p.jiangqian12}・${p.suiqian12}</div>`:'';
  return `<div class="cell ${p.name==='命宮'?'ming':''} ${pkey(p.name)===pkey(SEL)?'sel':''}" data-n="${pkey(p.name)}" style="grid-area:${r}/${c}">
    <div class="pname">${pname(p.name)}${badges}</div><div>${mj}</div><div>${mn}</div>${adj}${tw}
    <div class="dx">大限 ${p.decadal.range[0]}–${p.decadal.range[1]}</div><div class="pgz">${p.heavenlyStem}${p.earthlyBranch}</div></div>`;
}
const AREA={5:[1,1],6:[1,2],7:[1,3],8:[1,4],4:[2,1],9:[2,4],3:[3,1],10:[3,4],2:[4,1],1:[4,2],0:[4,3],11:[4,4]};
function centerHTML(){
  const rl=A.rawDates.lunarDate, cd=A.chineseDate;
  const body=A.palaces.find(p=>p.isBodyPalace);
  const row=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;
  return `<div class="center"><h3>${INFO.name?esc(INFO.name)+' 的命盤':'命盤資料'}</h3>
    ${row('性別',A.gender+'（'+(['甲','丙','戊','庚','壬'].includes(cd.split(' ')[0][0])?'陽':'陰')+A.gender+'）')}
    ${row('國曆',INFO.ds+'　'+A.time)}${row('農曆',fx(A.lunarDate))}${row('四柱',cd)}
    ${row('生肖／星座',A.zodiac+'／'+A.sign)}${row('五行局',A.fiveElementsClass)}
    ${row('命主／身主',A.soul+'／'+A.body)}${row('身宮',body.earthlyBranch+'（'+pname(body.name)+'）')}</div>`;
}
function drawChart(){
  $('chart').innerHTML=A.palaces.map(cellHTML).join('')+centerHTML();
}
function render(){
  const soul=palOf('命宮');
  $('out').innerHTML=`
  <section class="card"><h2>🪐 命盤</h2>
    <div class="opts"><label><input type="checkbox" id="oAdj" ${SHOW_ADJ?'checked':''}>顯示雜曜</label><label><input type="checkbox" id="o12" ${SHOW_12?'checked':''}>顯示十二神（長生・博士・將前・歲前）</label></div>
    <div class="chartwrap"><div class="chart" id="chart"></div></div>
    <div class="legend"><span>紅色大字＝十四主星</span><span style="color:#15803d">綠＝吉星</span><span style="color:#475569">灰＝煞星</span><span style="color:#0369a1">藍＝天馬</span>
      <span>星名右上角：<sup class="br br-廟">廟</sup><sup class="br br-旺">旺</sup>強 <sup class="br br-得">得</sup><sup class="br br-利">利</sup>中 <sup class="br br-平">平</sup>普通 <sup class="br br-陷">陷</sup>弱</span>
      <span><span class="hua 祿">祿</span><span class="hua 權">權</span><span class="hua 科">科</span><span class="hua 忌">忌</span> 生年四化</span></div>
    <div class="info">👆 點任一宮位，下方會顯示該宮的詳細解釋。</div>
    <div class="center-btns"><button class="btn" onclick="saveProfile()">💾 儲存這個命盤到此裝置</button><button class="btn ghost" onclick="saveCard()">🖼 儲存命盤圖片</button></div>
  </section>
  <section class="card" id="detail"></section>
  <section class="card" id="soulread"></section>
  <section class="card" id="huaread"></section>
  <section class="card" id="horo"></section>
  <section class="card"><h2>📚 名詞白話說明</h2>${GLOSSARY.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join('')}</section>`;
  drawChart(); renderDetail(); renderSoul(); renderHua(); renderHoro();
  $('chart').onclick=e=>{const c=e.target.closest('.cell[data-n]');if(c){SEL=c.dataset.n;drawChart();renderDetail();$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}};
  $('oAdj').onchange=e=>{SHOW_ADJ=e.target.checked;drawChart()};
  $('o12').onchange=e=>{SHOW_12=e.target.checked;drawChart()};
}

/* ----- 單宮詳解 ----- */
function starLine(s,key,borrow){
  const info=STAR[s.name], br=s.brightness;
  let txt=info?info[key]:'';
  const eff=br&&BR[br]?`<span class="tag">${s.name}・${br}</span> ${BR[br]}。`:'';
  const hua=s.mutagen?` <span class="hua ${s.mutagen}">${s.mutagen}</span> 化${s.mutagen}：${HMEAN[s.mutagen]}。`:'';
  return `<p>${eff}${txt}${hua}</p>`;
}
function renderDetail(){
  const p=palOf(SEL), nm=pkey(p.name);
  const key=(nm==='財帛'||nm==='官祿')?'w':nm==='夫妻'?'l':'t';
  const sur=A.surroundedPalaces(p.name);
  let html=`<h2>🔎 ${pname(p.name)}（${p.heavenlyStem}${p.earthlyBranch}）詳解</h2>
  <p class="p"><b>${pname(p.name)}代表：</b>${PALMEAN[nm]}。大限 ${p.decadal.range[0]}–${p.decadal.range[1]} 歲走到這一宮。</p>`;
  let ms=p.majorStars, borrowed=false;
  if(!ms.length){ms=sur.opposite.majorStars;borrowed=true}
  if(ms.length){
    html+=`<h3>主星${borrowed?'（本宮無主星，借對宮'+pname(sur.opposite.name)+'的星來看）':''}</h3>`+ms.map(s=>starLine(s,key)).join('');
  }else html+=`<div class="explain">本宮與對宮都沒有主星，這代表此領域的特質較受輔星、煞星與環境影響，彈性大、可塑性高。</div>`;
  if(p.minorStars.length) html+=`<h3>輔星與煞星</h3>`+p.minorStars.map(s=>`<p><span class="tag">${s.name}${s.brightness?'・'+s.brightness:''}</span>${SM[s.name]||''}${s.mutagen?` <span class="hua ${s.mutagen}">${s.mutagen}</span>`:''}</p>`).join('');
  if(p.adjectiveStars.length) html+=`<h3>雜曜（補充細節）</h3><p>`+p.adjectiveStars.map(s=>`<span class="tag">${s.name}</span>${ADJ[s.name]||'輔助性小星'}　`).join('')+`</p>`;
  html+=`<h3>三方四正（要一起看）</h3><div class="grid2">`+[['本宮',sur.target],['對宮',sur.opposite],['財帛位',sur.wealth],['官祿位',sur.career]].map(([l,x])=>`<div class="box"><h3>${l}：${pname(x.name)}</h3><p>${x.majorStars.map(s=>s.name+(s.brightness?'（'+s.brightness+'）':'')).join('、')||'無主星'}</p></div>`).join('')+`</div>`;
  html+=`<div class="explain">十二神：${p.changsheng12}（${CS[p.changsheng12]||''}）、博士十二神「${p.boshi12}」。屬進階參考，可先略過。</div>`;
  $('detail').innerHTML=html;
}

/* ----- 命宮整體解讀 ----- */
function renderSoul(){
  const p=palOf('命宮'), sur=A.surroundedPalaces('命宮'), body=A.palaces.find(x=>x.isBodyPalace);
  let ms=p.majorStars, borrow=false; if(!ms.length){ms=sur.opposite.majorStars;borrow=true}
  const txt=s=>{let t=STAR[s.name].t; if(s.brightness==='陷')t+='（此星落陷，上述特質較難順暢發揮，需要後天磨練。）'; else if(s.brightness==='廟'||s.brightness==='旺')t+='（廟旺，特質容易正面發揮。）'; return `<b>${s.name}${s.brightness?'（'+s.brightness+'）':''}</b>：${t}`};
  const w=sur.wealth.majorStars.map(s=>s.name).join('、')||'無主星', c=sur.career.majorStars.map(s=>s.name).join('、')||'無主星', o=sur.opposite.majorStars.map(s=>s.name).join('、')||'無主星';
  $('soulread').innerHTML=`<h2>🔮 命宮解讀</h2>
  <p class="p"><b>命宮在${p.earthlyBranch}宮（${p.heavenlyStem}${p.earthlyBranch}）</b>，${A.fiveElementsClass}，起運年齡 ${p.decadal.range[0]} 歲。${borrow?'命宮無主星，借對宮（遷移宮）的星曜來看。':''}</p>
  ${ms.map(s=>`<p class="p">${txt(s)}</p>`).join('')||'<p class="p">命宮與對宮皆無主星，性格較受輔星煞星與環境影響。</p>'}
  <div class="explain"><b>命主 ${A.soul}</b>：先天性格底色。<b>身主 ${A.body}</b>：後天發展傾向。<br><b>身宮</b>落在<b>${pname(body.name)}</b>（${body.earthlyBranch}宮）：後天（約 30 歲後）人生重心偏向「${PALMEAN[pkey(body.name)]}」。</div>
  <h3>三方四正總覽</h3>
  <p class="p">命宮三方四正的主星：對宮遷移宮 ${o}；財帛宮 ${w}；官祿宮 ${c}。這四個位置合起來，描繪你的整體格局：<b>遷移</b>是外在環境與社會形象，<b>財帛</b>是賺錢能力，<b>官祿</b>是事業舞台。</p>
  <div class="grid2">${['財帛','官祿','夫妻','福德'].map(n=>{const q=palOf(n), m=q.majorStars.length?q.majorStars:A.surroundedPalaces(q.name).opposite.majorStars, k=(n==='財帛'||n==='官祿')?'w':n==='夫妻'?'l':'t';
    return `<div class="box"><h3>${n}宮｜${q.majorStars.map(s=>s.name).join('、')||'無主星（借對宮）'}</h3><p style="color:var(--mute)">${PALMEAN[n]}</p><p>${m.map(s=>STAR[s.name][k]).join(' ')||'此宮無主星，彈性較大。'}</p></div>`}).join('')}</div>`;
}

/* ----- 生年四化 ----- */
function renderHua(){
  const items=[]; A.palaces.forEach(p=>[...p.majorStars,...p.minorStars].forEach(s=>{if(s.mutagen)items.push({m:s.mutagen,s:s.name,p})}));
  const stem=A.chineseDate[0];
  $('huaread').innerHTML=`<h2>✨ 生年四化（${stem}年）</h2><div class="explain">四化是依「出生年天干」把四顆星貼上標籤，看它們落在哪個宮位，就知道人生的哪個領域特別有這種色彩。</div><div class="sihua">`+
   HNAME.map(h=>{const it=items.find(x=>x.m===h); if(!it) return ''; return `<div class="shi" style="background:${HCOL[h]}"><b>${it.s}化${h}</b>　落${pname(it.p.name)}<small>${HMEAN[h]}<br>${pname(it.p.name)}：${PALMEAN[pkey(it.p.name)]}</small></div>`}).join('')+`</div>`;
}

/* ----- 運限：大限、小限、流年 ----- */
function renderHoro(){
  const lunarY=A.rawDates.lunarDate.lunarYear, nowY=new Date().getFullYear();
  if(!A._ry) A._ry=Math.min(Math.max(nowY,lunarY),lunarY+100);
  const ry=A._ry, H=A.horoscope(new Date(ry,5,15));
  const dec=A.palaces[H.decadal.index], yr=A.palaces[H.yearly.index], age=A.palaces[H.age.index];
  const where=(star)=>{const q=starPalace(star);return q?pname(q.name):'—'};
  const huaList=(mut)=>mut.map((s,i)=>`<span class="hua ${HNAME[i]}">${HNAME[i]}</span> ${s} → 本命${where(s)}`).join('<br>');
  const yearlyStars=H.yearly.stars.map((arr,i)=>arr.filter(s=>['流祿','流羊','流陀','流昌','流曲','流魁','流鉞','流馬'].includes(s.name)).map(s=>s.name+'→'+pname(A.palaces[i].name))).flat();
  const yearsInDec=[]; for(let a=dec.decadal.range[0];a<=dec.decadal.range[1];a++) yearsInDec.push(a);
  const rows=yearsInDec.map(a=>{const y=lunarY-1+a, h=A.horoscope(new Date(y,5,15)), q=A.palaces[h.yearly.index];
    return `<tr class="yr ${y===ry?'cur':''}" onclick="setYear(${y})"><td>${y}</td><td>${a} 歲</td><td>${pname(q.name)}（${h.yearly.heavenlyStem}${h.yearly.earthlyBranch}）</td><td>${h.yearly.mutagen.map((s,i)=>`<span class="hua ${HNAME[i]}">${HNAME[i]}</span>${s}`).join(' ')}</td></tr>`}).join('');
  $('horo').innerHTML=`<h2>⏳ 運限（大限・小限・流年）</h2>
  <div class="row" style="align-items:end;max-width:420px"><div><label>想看哪一年（西元）</label><input type="number" id="ryear" value="${ry}" min="${lunarY}" max="${lunarY+110}" onchange="setYear(+this.value)"></div>
  <div style="display:flex;gap:8px"><button class="tab" onclick="setYear(${ry-1})">◀ 前一年</button><button class="tab" onclick="setYear(${ry+1})">後一年 ▶</button></div></div>
  <p class="p" style="margin-top:12px">${ry} 年，你虛歲 <b>${H.age.nominalAge}</b> 歲。</p>
  <div class="grid2">
   <div class="box"><h3>大限（十年運）</h3><p>${dec.decadal.range[0]}–${dec.decadal.range[1]} 歲，走到本命<b>${pname(dec.name)}</b>（${dec.heavenlyStem}${dec.earthlyBranch}）。<br>這十年重心偏向：${PALMEAN[pkey(dec.name)]}。</p>
    <p style="font-size:13px">大限四化：<br>${huaList(H.decadal.mutagen)}</p></div>
   <div class="box"><h3>流年（${ry}）</h3><p>流年命宮落在本命<b>${pname(yr.name)}</b>（${H.yearly.heavenlyStem}${H.yearly.earthlyBranch}）。這一年的重心偏向：${PALMEAN[pkey(yr.name)]}。</p>
    <p style="font-size:13px">流年四化：<br>${huaList(H.yearly.mutagen)}</p>${yearlyStars.length?`<p style="font-size:13px">流年星：${yearlyStars.join('、')}</p>`:''}</div>
   <div class="box"><h3>小限（${H.age.nominalAge} 歲）</h3><p>小限落在本命<b>${pname(age.name)}</b>（${H.age.heavenlyStem}${H.age.earthlyBranch}），代表這一歲較顯著的生活主題：${PALMEAN[pkey(age.name)]}。</p></div>
  </div>
  <div class="explain"><b>怎麼看四化落宮？</b>流年的「<b style="color:#dc2626">忌</b>」落入哪個宮位，那個領域這一年容易有壓力或需要多留意；「<b style="color:#16a34a">祿</b>」落入的宮位，代表機會與順利；「<b style="color:#2563eb">權</b>」是主動掌控、「<b style="color:#d97706">科</b>」是好口碑與貴人。</div>
  <h3>這個大限的十年流年一覽（點一列切換年份）</h3>
  <div style="overflow-x:auto"><table><tr><th>年份</th><th>虛歲</th><th>流年命宮落本命</th><th>流年四化</th></tr>${rows}</table></div>`;
}
function setYear(y){ if(!A) return; A._ry=y; renderHoro(); }

/* ========== 介面與儲存 ========== */
const MN=['','正','二','三','四','五','六','七','八','九','十','冬','臘'];
const DN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function setMode(m){MODE=m;
  $('solarBox').classList.toggle('hidden',m!=='solar');$('lunarBox').classList.toggle('hidden',m!=='lunar');
  $('tabS').classList.toggle('on',m==='solar');$('tabL').classList.toggle('on',m==='lunar');}
function initSel(){
  for(let i=1;i<=12;i++) $('lmonth').add(new Option(MN[i]+'月',i));
  for(let i=1;i<=30;i++) $('lday').add(new Option(DN[i-1],i));
  SHICHEN.forEach((t,i)=>$('shichen').add(new Option(t,i)));
  $('lmonth').value=5;$('lday').value=18;$('shichen').value=7;
}
const FIELDS=['sdate','shichen','gender','nm','lyear','lmonth','lday','lleap'];
function getInp(){const o={mode:MODE};FIELDS.forEach(f=>o[f]=$(f).value);return o}
function setInp(o){setMode(o.mode||'solar');FIELDS.forEach(f=>{if(o[f]!=null&&$(f))$(f).value=o[f]})}
const PK='hub.ziwei.profiles';
function saveProfile(){
  const i=getInp(), list=ld(PK,[]);
  const label=i.nm||(i.mode==='solar'?i.sdate:'農曆 '+i.lyear+'/'+i.lmonth+'/'+i.lday);
  list.unshift({id:Date.now(),label,inp:i}); sv(PK,list.slice(0,20)); renderSaved(); alert('已儲存到這台裝置');
}
function loadProfile(id){const p=ld(PK,[]).find(x=>x.id===id); if(p){setInp(p.inp);run()}}
function delProfile(id){sv(PK,ld(PK,[]).filter(x=>x.id!==id));renderSaved()}
function renderSaved(){
  const list=ld(PK,[]).filter(p=>p.inp&&p.inp.shichen!=null);
  $('savedcard').classList.toggle('hidden',!list.length);
  $('saved').innerHTML=list.map(p=>`<div class="box" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span><b>${esc(p.label)}</b> <small style="color:var(--mute)">${p.inp.gender==='M'?'男':'女'} ${esc(p.inp.mode==='solar'?p.inp.sdate:'農曆輸入')}</small></span><span><button class="tab" style="padding:5px 12px" onclick="loadProfile(${p.id})">開啟</button> <button class="tab" style="padding:5px 12px" onclick="if(confirm('刪除這筆？'))delProfile(${p.id})">刪除</button></span></div>`).join('');
}

/* ========== 命盤圖片 ========== */
async function saveCard(){
  const F=HubKit.FONT, W=1000, H=1020, cw=230, ch=200, ox=40, oy=130;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#2a1d5c'); g.addColorStop(1,'#171230'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textAlign='center'; x.fillStyle='#fff'; x.font='bold 40px '+F; x.fillText('紫微斗數命盤'+(INFO.name?'・'+INFO.name:''),W/2,70);
  x.fillStyle='#cfc7ee'; x.font='22px '+F; x.fillText(A.fiveElementsClass+'　命主 '+A.soul+'　身主 '+A.body+'　'+A.gender,W/2,105);
  const BADCOL=t=>t==='soft'?'#15803d':t==='tough'?'#555':t==='lucun'?'#15803d':t==='tianma'?'#0369a1':'#7c3aed';
  A.palaces.forEach(p=>{
    const [r,cc]=AREA[ZHI.indexOf(p.earthlyBranch)], px=ox+(cc-1)*cw, py=oy+(r-1)*ch;
    x.fillStyle=p.name==='命宮'?'#f3edff':'#fffaf0'; x.fillRect(px+2,py+2,cw-4,ch-4);
    x.textAlign='left'; x.fillStyle='#5b3fd1'; x.font='bold 22px '+F; x.fillText(pname(p.name)+(p.name==='命宮'?'·命':'')+(p.isBodyPalace?'·身':''),px+10,py+30);
    let cx=px+10, cy=py+64; x.font='bold 22px '+F;
    p.majorStars.forEach(s=>{const t=s.name+(s.brightness||'')+(s.mutagen?'['+s.mutagen+']':''), w=x.measureText(t).width+10; if(cx+w>px+cw-6){cx=px+10;cy+=28} x.fillStyle='#b91c1c'; x.fillText(t,cx,cy); cx+=w});
    if(!p.majorStars.length){x.font='18px '+F;x.fillStyle='#999';x.fillText('（無主星）',px+10,cy)}
    cx=px+10; cy+=28; x.font='17px '+F;
    p.minorStars.forEach(s=>{const t=s.name+(s.brightness||'')+(s.mutagen?'['+s.mutagen+']':''), w=x.measureText(t).width+8; if(cx+w>px+cw-6){cx=px+10;cy+=22} x.fillStyle=BADCOL(s.type); x.fillText(t,cx,cy); cx+=w});
    x.fillStyle='#8a8499'; x.font='16px '+F; x.fillText('大限 '+p.decadal.range[0]+'–'+p.decadal.range[1],px+10,py+ch-12);
    x.textAlign='right'; x.fillText(p.heavenlyStem+p.earthlyBranch,px+cw-10,py+ch-12);
  });
  x.strokeStyle='#c8a24a'; x.lineWidth=4; x.strokeRect(ox,oy,cw*4,ch*4);
  x.lineWidth=2; for(let i=1;i<4;i++){x.beginPath();x.moveTo(ox+i*cw,oy);x.lineTo(ox+i*cw,oy+ch*4);x.stroke();x.beginPath();x.moveTo(ox,oy+i*ch);x.lineTo(ox+cw*4,oy+i*ch);x.stroke()}
  x.fillStyle='#fffdf8'; x.fillRect(ox+cw+2,oy+ch+2,cw*2-4,ch*2-4);
  const body=A.palaces.find(p=>p.isBodyPalace);
  const info=[['國曆',INFO.ds+' '+A.time],['農曆',fx(A.lunarDate)],['四柱',A.chineseDate],['生肖／星座',A.zodiac+'／'+A.sign],['五行局',A.fiveElementsClass],['身宮',body.earthlyBranch+'（'+pname(body.name)+'）']];
  x.font='20px '+F; info.forEach((r,i)=>{const y=oy+ch+50+i*52; x.textAlign='left'; x.fillStyle='#7a7090'; x.fillText(r[0],ox+cw+24,y); x.textAlign='right'; x.fillStyle='#2a2140'; x.fillText(r[1],ox+cw*3-24,y)});
  x.textAlign='center'; x.fillStyle='#9a96ad'; x.font='18px '+F; x.fillText('此圖片內含備份資料，可到首頁「匯入」還原',W/2,H-24);
  await HubKit.download(c,'紫微命盤'+(INFO.name?'-'+INFO.name:'')+'.png');
}

initSel();
{const last=ld('hub.ziwei.last',null); if(last&&last.shichen!=null) setInp(last); renderSaved();}
</script>
