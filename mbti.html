<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTI 性格測驗</title>
<style>
:root{
  --bg:#f5f3ff; --card:#fff; --ink:#1f1b2e; --mute:#6b6880; --line:#e6e3f3;
  --main:#6c4cf1; --main2:#8b72ff;
  --E:#f59e0b; --I:#3b82f6; --S:#10b981; --N:#8b5cf6; --T:#ef4444; --F:#ec4899; --J:#0ea5e9; --P:#f97316;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:linear-gradient(160deg,#f5f3ff,#eef6ff);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border-radius:20px;box-shadow:0 8px 30px rgba(80,60,160,.10);padding:28px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:var(--mute);line-height:1.7}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:17px;font-weight:600}
.btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main)}
.btn:hover{filter:brightness(1.07)}
.hidden{display:none}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--main2));width:0;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.qtext{font-size:21px;font-weight:700;line-height:1.5;margin:22px 0 18px}
.opt{display:block;width:100%;text-align:left;background:#faf9ff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;line-height:1.5;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--main);background:#f1edff;transform:translateX(3px)}
.opt.sel{border-color:var(--main);background:#e9e3ff}
.nav{display:flex;justify-content:space-between;margin-top:8px}
.link{background:none;border:0;color:var(--mute);font-size:15px;padding:6px}
.link:disabled{opacity:.3;cursor:default}
/* result */
.hero{text-align:center;padding:10px 0 4px}
.type{font-size:64px;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,var(--main),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.tname{font-size:22px;font-weight:700;margin-top:4px}
.tag{color:var(--mute);margin-top:6px}
h2{font-size:20px;margin:30px 0 12px;padding-left:10px;border-left:5px solid var(--main)}
.dim{margin:16px 0}
.dimhead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{display:flex;height:30px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;transition:width 1s ease;width:0;min-width:0;white-space:nowrap;overflow:hidden}
.dimnote{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.6}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
@media(max-width:640px){.charts{grid-template-columns:1fr}.type{font-size:52px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.box{background:#faf9ff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-size:16px}
.box ul{margin:0;padding-left:20px;line-height:1.8}
.chips span{display:inline-block;background:#ece8ff;color:var(--main);border-radius:99px;padding:4px 12px;margin:3px 4px 3px 0;font-size:14px}
p.desc{line-height:1.9;margin:0}
.note{font-size:13px;color:var(--mute);margin-top:26px;line-height:1.7}
.avatar{width:190px;height:190px;margin:0 auto 4px;display:block}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.pairs{grid-template-columns:1fr}}
.pcol h3{margin:0 0 10px;font-size:16px}
.pcard{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px;margin-bottom:10px;border:1.5px solid}
.pcard.good{background:#ecfdf5;border-color:#a7f3d0}
.pcard.bad{background:#fff1f2;border-color:#fecdd3}
.pcard svg{width:64px;height:64px;flex:none}
.pcard b{display:block}
.pcard small{color:var(--mute);line-height:1.6;display:block}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.gallery{grid-template-columns:repeat(2,1fr)}}
.gitem{background:#faf9ff;border:1.5px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px}
.gitem:hover,.gitem.on{border-color:var(--main);background:#f1edff}
.gitem svg{width:78px;height:78px;display:block;margin:0 auto 2px}
.gitem b{display:block;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:13px;color:var(--mute)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}

.back{display:inline-block;padding:10px 6px}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
@media(max-width:640px){
 .wrap{padding:12px 10px 76px}
 .card{padding:14px;border-radius:14px}
 h1{font-size:23px;letter-spacing:2px}
 h2{font-size:17px}
 .lead{font-size:14px}
 .btn{width:100%;margin:10px 0 0;padding:14px 18px;min-height:50px}
 .tab,.mt,.dirbtns button{min-height:44px}
 input,select,textarea{padding:12px;min-height:46px}
 .explain{font-size:14px}
}
.link{padding:12px 10px;font-size:16px;min-height:44px}
.opt{padding:16px}
</style>
</head>

<div class="wrap">
<p style="margin:0 0 10px"><a class="back" href="index.html" style="color:#6c4cf1;text-decoration:none">← 回首頁</a></p>

<!-- 開始 -->
<section id="start" class="card">
  <h1>🧠 MBTI 性格測驗</h1>
  <p class="sub">共 24 題，每題 4 個選項，約需 5 分鐘。請依照「平時真實的你」作答，而不是「你希望成為的樣子」。沒有對錯，也沒有好壞之分。<br>
  結束後會得到：你的 16 型人格、四個維度的比例圖表，以及性格分析、優缺點與適合的方向。</p>
  <p style="text-align:center;margin-top:28px"><button class="btn" onclick="startQuiz()">開始測驗</button></p>
  <div id="hist"></div>
</section>

<!-- 題目 -->
<section id="quiz" class="card hidden">
  <div class="pinfo"><span id="pnum"></span><span id="ppct"></span></div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="qtext" id="qtext"></div>
  <div id="opts"></div>
  <div class="nav">
    <button class="link" id="back" onclick="goBack()">← 上一題</button>
    <button class="link" onclick="if(confirm('確定要重新開始？'))restart()">重新開始</button>
  </div>
</section>

<!-- 結果 -->
<section id="result" class="card hidden"></section>

</div>

const SAME={0:'都是外向，節奏相近、一拍即合',1:'都偏內向，彼此尊重獨處空間',2:'都重視事實與細節，溝通務實',3:'都著眼可能性與未來，聊得來',4:'都以邏輯分析看事情',5:'都重視感受與價值觀，容易同理',6:'都偏好計畫與秩序，生活步調一致',7:'都偏好彈性隨興，彼此不拘束'};
const DIFF={0:'外向與內向互補：一方帶動、一方沉澱',1:'實感與直覺互補：務實與創意相輔相成',2:'思考與情感互補：理性與溫度兼顧',3:'判斷與感知互補：有計畫也有彈性'};
const IDX=[['E','I'],['S','N'],['T','F'],['J','P']];
function why(a,b,good){
  const same=[],diff=[];
  IDX.forEach((p,i)=>{ if(a[i]===b[i]) same.push(SAME[i*2+(a[i]===p[0]?0:1)]); else diff.push(DIFF[i]); });
  if(good) return (diff.slice(0,2).concat(same.slice(0,1))).join('；')+'。';
  // 不合：說明衝突點
  const c=[];
  if(a[1]!==b[1]) c.push('一個重細節現實、一個重概念未來，常雞同鴨講');
  if(a[2]!==b[2]) c.push('一個講邏輯、一個重感受，容易覺得對方太冷或太情緒化');
  if(a[3]!==b[3]) c.push('計畫派與隨興派的步調容易起摩擦');
  if(a[0]!==b[0]) c.push('社交與獨處需求落差大');
  if(!c.length) c.push('相似度太高，缺點會被放大');
  return c.slice(0,2).join('；')+'。需要更多溝通與包容。';
}
function pcard(me,o,good){
  return `<div class="pcard ${good?'good':'bad'}">${avatar(o)}<div><b>${o}｜${TYPES[o].n}（${ANIMAL[o][1]}）</b><small>${why(me,o,good)}</small></div></div>`;
}
function pairHTML(me){
  return `<div class="pairs">
    <div class="pcol"><h3>💚 最適合 ${me} 的類型</h3>${BEST[me].map(o=>pcard(me,o,true)).join('')}</div>
    <div class="pcol"><h3>💔 較容易有摩擦的類型</h3>${[...HARD[me]].map(o=>pcard(me,o,false)).join('')}</div>
  </div>`;
}
function galleryHTML(){
  return `<div class="gallery">${Object.keys(TYPES).map(k=>`<button class="gitem" onclick="viewPair('${k}',this)">${avatar(k)}<b>${k}</b>${ANIMAL[k][1]}</button>`).join('')}</div>`;
}
function viewPair(k,btn){
  document.querySelectorAll('.gitem').forEach(x=>x.classList.remove('on')); btn.classList.add('on');
  $('pairview').innerHTML=`<h3 style="margin:16px 0 10px">${k}｜${TYPES[k].n} 的配對</h3>`+pairHTML(k);
  $('pairview').scrollIntoView({behavior:'smooth',block:'nearest'});
}

let order, cur, ans;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function $(id){return document.getElementById(id)}

function startQuiz(){
  // 題目順序固定（已交錯四個維度），選項順序隨機
  order = Q.map((q,i)=>({dim:q[0],text:q[1],opts:shuffle(q[2].map((t,k)=>({t,k})))}));
  cur=0; ans=new Array(order.length).fill(null);
  $('start').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  render();
}
function restart(){ $('quiz').classList.add('hidden'); $('result').classList.add('hidden'); $('start').classList.remove('hidden'); renderHist(); window.scrollTo(0,0)}
function render(){
  const q=order[cur];
  $('pnum').textContent=`第 ${cur+1} / ${order.length} 題`;
  $('ppct').textContent=Math.round(cur/order.length*100)+'%';
  $('pbar').style.width=(cur/order.length*100)+'%';
  $('qtext').textContent=q.text;
  $('back').disabled = cur===0;
  const box=$('opts'); box.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(ans[cur]===i?' sel':'');
    b.textContent=String.fromCharCode(65+i)+'．'+o.t;
    b.onclick=()=>choose(i);
    box.appendChild(b);
  });
}
function choose(i){
  ans[cur]=i;
  if(cur<order.length-1){cur++;setTimeout(render,120)} else showResult();
}
function goBack(){ if(cur>0){cur--;render()} }

function showResult(){
  // 計分
  const sc={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  order.forEach((q,n)=>{
    const o=q.opts[ans[n]]; const [pole,w]=W[o.k];
    sc[DIMS[q.dim].p[pole]]+=w;
  });
  const pct={}; let code='';
  const dimInfo=[];
  for(const d of ['EI','SN','TF','JP']){
    const [a,b]=DIMS[d].p, tot=sc[a]+sc[b]||1;
    pct[a]=Math.round(sc[a]/tot*100); pct[b]=100-pct[a];
    // 平手時取 I/N/F/P
    const win = sc[a]>sc[b]?a:b;
    code+=win;
    dimInfo.push({d,win,a,b,strength:Math.abs(pct[a]-50)*2});
  }
  const T=TYPES[code]; saveRes(code,pct); lastRes={code,pct};
  const level = s => s>=60?'非常明顯':s>=30?'中等':'輕微';
  const dimHTML = dimInfo.map(x=>{
    const [na,nb]=DIMS[x.d].names;
    const wn = x.win===x.a?na:nb;
    return `<div class="dim">
      <div class="dimhead"><span style="color:${col(x.a)}">${na} ${pct[x.a]}%</span><span style="color:${col(x.b)}">${pct[x.b]}% ${nb}</span></div>
      <div class="bar"><span style="background:${col(x.a)}" data-w="${pct[x.a]}">${pct[x.a]>=12?x.a:''}</span><span style="background:${col(x.b)}" data-w="${pct[x.b]}">${pct[x.b]>=12?x.b:''}</span></div>
      <div class="dimnote">你偏向「${wn}」，傾向程度：${level(x.strength)}。${notes[x.win]}</div>
    </div>`;}).join('');

  $('result').innerHTML=`
    <div class="hero">
      <div class="avatar">${avatar(code)}</div>
      <div class="sub">你的 MBTI 類型是</div>
      <div class="type">${code}</div>
      <div class="tname">${T.n}　<span style="font-size:16px;color:var(--mute)">守護動物：${ANIMAL[code][1]}</span></div>
      <div class="tag">${T.t}</div>
    </div>
    <h2>性格比例圖表</h2>
    ${dimHTML}
    <div class="charts">
      <div>${radar(pct)}</div>
      <div>${donut(sc)}</div>
    </div>
    <div class="legend">${['E','I','S','N','T','F','J','P'].map(k=>`<span><b style="background:${col(k)}"></b>${k} ${pct[k]}%</span>`).join('')}</div>
    <h2>性格分析</h2>
    <p class="desc">${T.d}</p>
    <div class="grid2" style="margin-top:16px">
      <div class="box"><h3>💪 優勢</h3><ul>${T.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="box"><h3>⚠️ 可留意的盲點</h3><ul>${T.w.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="box" style="margin-top:14px"><h3>💼 適合的方向</h3><div class="chips">${T.c.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <h2>配對分析：誰與你最合拍？</h2>
    ${pairHTML(code)}
    <div class="note" style="margin-top:4px">配對僅依四維度的互補與相似度推論，真實關係更取決於成熟度、溝通與彼此用心，任何組合都可以相處得很好。</div>
    <h2>16 型人物圖鑑（點選查看該型配對）</h2>
    ${galleryHTML()}
    <div id="pairview"></div>
    <p style="text-align:center;margin-top:28px"><button class="btn" onclick="saveCard()">🖼 儲存結果圖片</button>　<button class="btn ghost" onclick="startQuiz()">重新測驗</button></p>
    <div class="note">※ 本測驗為依 MBTI 四維度架構編寫的簡易自我探索工具，非官方正式測評，結果僅供參考。比例越接近 50%，代表你在該維度上兩種傾向都會使用；性格會隨情境與成長而變化，請把它當作了解自己的起點，而不是標籤。</div>
  `;
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden'); window.scrollTo(0,0);
  requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('.bar span').forEach(s=>s.style.width=s.dataset.w+'%')},50));
}

const notes={
 E:'你從與人互動中獲得能量，喜歡表達、行動，思考常在交談中成形。',
 I:'你需要獨處來恢復能量，偏好深入思考後再行動，與少數人深交。',
 S:'你注重具體事實與現實經驗，相信看得見、摸得著的資訊。',
 N:'你重視可能性與整體脈絡，喜歡抽象概念與未來想像。',
 T:'你做判斷時偏重邏輯、客觀與一致性。',
 F:'你做判斷時偏重價值觀、人際和諧與他人感受。',
 J:'你偏好有計畫、有條理，喜歡事情有明確結論。',
 P:'你偏好彈性、隨機應變，喜歡保持選項開放。'
};

/* 雷達圖：8 種傾向 */
function radar(pct){
  const keys=['E','S','T','J','I','N','F','P'], cx=160, cy=150, R=100;
  const pt=(i,r)=>{const a=(-90+45*i)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g='';
  [25,50,75,100].forEach(l=>{g+=`<polygon points="${keys.map((_,i)=>pt(i,R*l/100).join(',')).join(' ')}" fill="none" stroke="#e6e3f3"/>`});
  keys.forEach((k,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e3f3"/>`;
    const [lx,ly]=pt(i,R+20);g+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${col(k)}">${k}</text>`});
  const poly=keys.map((k,i)=>pt(i,R*pct[k]/100).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(108,76,241,.22)" stroke="#6c4cf1" stroke-width="2"/>`;
  keys.forEach((k,i)=>{const [x,y]=pt(i,R*pct[k]/100);g+=`<circle cx="${x}" cy="${y}" r="4" fill="${col(k)}"/>`});
  return `<svg viewBox="0 0 320 300" width="100%"><text x="160" y="14" text-anchor="middle" font-size="13" fill="#6b6880">八種傾向雷達圖</text>${g}</svg>`;
}
/* 甜甜圈：8 種傾向佔總得分比例 */
function donut(sc){
  const keys=['E','I','S','N','T','F','J','P'], tot=keys.reduce((s,k)=>s+sc[k],0)||1;
  const cx=160, cy=150, r=78, sw=36, L=2*Math.PI*r; let off=0, g='';
  keys.forEach(k=>{const len=sc[k]/tot*L; if(len>0){
    g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col(k)}" stroke-width="${sw}" stroke-dasharray="${len} ${L-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    const mid=(off+len/2)/L*2*Math.PI-Math.PI/2;
    if(len/L>0.05) g+=`<text x="${cx+r*Math.cos(mid)}" y="${cy+r*Math.sin(mid)+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${k}</text>`;
    off+=len}});
  return `<svg viewBox="0 0 320 300" width="100%"><text x="160" y="14" text-anchor="middle" font-size="13" fill="#6b6880">八種傾向得分佔比</text>${g}<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" fill="#6b6880">總分 ${tot}</text></svg>`;
}

/* ===== 本機儲存（localStorage，只存在使用者自己的瀏覽器）===== */
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const HK='hub.mbti.history';
function saveRes(code,pct){const h=ld(HK,[]);h.unshift({t:Date.now(),code,pct});sv(HK,h.slice(0,10));}
function renderHist(){
  const h=ld(HK,[]), box=$('hist'); if(!box) return;
  if(!h.length){box.innerHTML='';return}
  box.innerHTML='<h2 style="margin-top:26px">📜 我的歷史結果（僅存在這台裝置）</h2>'+h.map(r=>{
    const d=new Date(r.t).toLocaleString('zh-TW',{hour12:false});
    return '<div class="box" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b style="font-size:18px;color:var(--main)">'+esc(r.code)+'</b> '+esc((TYPES[r.code]||{}).n||'')+'（'+esc((ANIMAL[r.code]||['',''])[1])+'）</span><span style="color:var(--mute);font-size:13px">'+d+'</span></div>'}).join('')+
    '<p style="text-align:center"><button class="btn ghost" style="padding:6px 18px;font-size:14px" onclick="if(confirm(&quot;清除全部歷史結果？&quot;)){sv(HK,[]);renderHist()}">清除紀錄</button></p>';
}
renderHist();

let lastRes=null;
async function saveCard(){
  const {code,pct}=lastRes, T=TYPES[code], W=900, H=1300, F=HubKit.FONT;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#f5f3ff'); g.addColorStop(1,'#e0f2fe'); x.fillStyle=g; x.fillRect(0,0,W,H);
  HubKit.rr(x,40,40,W-80,H-80,36); x.fillStyle='#fff'; x.fill();
  x.textAlign='center'; x.fillStyle='#6b6880'; x.font='30px '+F; x.fillText('我的 MBTI 性格',W/2,115);
  const im=await HubKit.svgToImg(avatar(code).replace('class="av"','width="400" height="400"')); x.drawImage(im,W/2-200,140,400,400);
  const tg=x.createLinearGradient(250,0,650,0); tg.addColorStop(0,'#6c4cf1'); tg.addColorStop(1,'#ec4899');
  x.fillStyle=tg; x.font='bold 120px '+F; x.fillText(code,W/2,690);
  x.fillStyle='#1f1b2e'; x.font='bold 42px '+F; x.fillText(T.n+'・守護動物：'+ANIMAL[code][1],W/2,760);
  x.fillStyle='#6b6880'; x.font='28px '+F; x.fillText(T.t,W/2,812);
  ['EI','SN','TF','JP'].forEach((dm,i)=>{
    const [a,b]=DIMS[dm].p, y=880+i*88, bx=110, bw=W-220, wa=bw*pct[a]/100;
    x.textAlign='left'; x.fillStyle=col(a); x.font='bold 26px '+F; x.fillText(DIMS[dm].names[0].split(' ')[0]+' '+pct[a]+'%',bx,y);
    x.textAlign='right'; x.fillStyle=col(b); x.fillText(pct[b]+'% '+DIMS[dm].names[1].split(' ')[0],bx+bw,y);
    HubKit.rr(x,bx,y+12,bw,28,14); x.save(); x.clip(); x.fillStyle=col(a); x.fillRect(bx,y+12,wa,28); x.fillStyle=col(b); x.fillRect(bx+wa,y+12,bw-wa,28); x.restore();
    x.textAlign='center'; x.fillStyle='#fff'; x.font='bold 20px '+F;
    if(pct[a]>=12) x.fillText(a,bx+wa/2,y+33);
    if(pct[b]>=12) x.fillText(b,bx+wa+(bw-wa)/2,y+33);
  });
  x.textAlign='center'; x.fillStyle='#9a96ad'; x.font='22px '+F;
  x.fillText(new Date().toLocaleDateString('zh-TW')+'　此圖片內含備份資料，可到首頁「匯入」還原',W/2,H-90);
  await HubKit.download(c,'MBTI-'+code+'.png');
}
